<!DOCTYPE html>
<html lang='en'>

<head>
    <base href="..">
    <link rel="shortcut icon" type="image/png" href="assets/favicon.png"/>
    <link rel="stylesheet" type="text/css" media="all" href="assets/main.css"/>
    <meta name="description" content="Conference Template">
    <meta name="resource-type" content="document">
    <meta name="distribution" content="global">
    <meta name="KeyWords" content="Conference">
    <title>Flyer | Conference Template</title>

    <style>
        /* Layout for side-by-side flyers */
        .flyer-controls {
            text-align: center;
            margin: 15px 0;
            font-size: 0.9em;
        }
        .flyer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px; /* Space between the two flyers */
            margin: 20px auto;
            width: 95%; /* Adjust overall container width here */
        }
        .flyer-item {
            /* Adjust '48%' to change default side-by-side width */
            flex: 1 1 45%; 
            max-width: 500px; /* Set maximum pixel width when needed */
            min-width: 280px; /* Stacks cleanly on mobile screens */
            text-align: center;
        }
        .flyer-item img {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
    </style>
</head>

<body>

    <div class="banner">
        <img src="assets/banner2.jpg" alt="">
        <div class="top-left">
            <span class="title1">Malagasy</span><span class="title2">Astronomy</span><span class="title1">Meeting</span> <span class="year">2026</span>
        </div>
        <div class="bottom-right">
            16-18 December 2026 <br> Antananarivo, Madagascar
        </div>
    </div>

    <table class="navigation">
        <tr>
            <td class="navigation">
                <a title="Conference Home Page" href=".">Home</a>
            </td>
            <td class="navigation">
                <a title="Register for the Conference" href="registration">Registration</a>
            </td>
            <td class="navigation">
                <a title="Conference Program" href="program">Program</a> 
            </td>
            <td class="navigation">
                <a title="Directions to the Conference" href="directions">Directions</a>
            </td>
            <td class="navigation">
                <a class="current" title="Conference Flyer" href="flyer">Flyer</a>
            </td>
        </tr>
    </table>

    <!-- Optional Interactive Resize Control for Visitors -->
    <div class="flyer-controls">
        <label for="flyerSize"><strong>Display Size:</strong> </label>
        <input type="range" id="flyerSize" min="300" max="800" value="500" oninput="resizeFlyers(this.value)">
        <span id="sizeLabel">500px</span>
        <button type="button" onclick="resetFlyerSize()" style="margin-left: 8px; cursor: pointer;">Reset</button>
    </div>

    <!-- Side-by-Side Flyers Container -->
    <div class="flyer-container">
        <!-- Left Flyer: Meet the Organisers -->
        <div class="flyer-item">
            <a href="assets/MNA_logo/MAM%202026%20-%20Meet%20the%20organisers.png" target="_blank" title="Click to open full size">
                <img src="assets/MNA_logo/MAM%202026%20-%20Meet%20the%20organisers.png" alt="MAM 2026 - Meet the organisers">
            </a>
        </div>

        <!-- Right Flyer: Meet the Speakers -->
        <div class="flyer-item">
            <a href="assets/MNA_logo/MAM%202026%20-%20Meet%20the%20speakers.png" target="_blank" title="Click to open full size">
                <img src="assets/MNA_logo/MAM%202026%20-%20Meet%20the%20speakers.png" alt="MAM 2026 - Meet the speakers">
            </a>
        </div>
    </div>

    <footer>
        &copy; Astronomy Madagascar
        &nbsp;|&nbsp; Original Design by <a href="https://github.com/mikepierce">Mike Pierce</a>
    </footer>

    <script>
        function resizeFlyers(val) {
            document.getElementById('sizeLabel').textContent = val + 'px';
            document.querySelectorAll('.flyer-item').forEach(function(item) {
                item.style.maxWidth = val + 'px';
            });
        }
        function resetFlyerSize() {
            document.getElementById('flyerSize').value = 500;
            resizeFlyers(500);
        }
    </script>

</body>
</html>
